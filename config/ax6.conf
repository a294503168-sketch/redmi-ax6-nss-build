# Redmi AX6 固件构建配置（NSS 硬件加速 · 保留无线）
#
# 源码树：qosmio/openwrt-ipq 的 24.10-nss 分支
#   - 内核 6.6，上游 README 标注 stable，与官方 openwrt-24.10 同期
#   - feeds 钉在 openwrt-24.10 发布分支
#   - ipq807x 的 target.mk 里 kmod-qca-nss-drv / kmod-qca-nss-ecm 已是默认包
#   - 该分支的包管理器是 opkg（25.12 起才换成 apk，两者的 uci-defaults 写法不同）

REPO_URL="https://github.com/qosmio/openwrt-ipq.git"
REPO_BRANCH="24.10-nss"

# 目标平台 / 子平台 / 设备
TARGET="qualcommax"
SUBTARGET="ipq807x"
DEVICE="redmi_ax6"

# 并行编译任务数，留空则用 nproc
BUILD_JOBS=""
