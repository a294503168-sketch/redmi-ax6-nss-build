# Redmi AX6 固件构建配置（NSS 硬件加速版）
#
# 源码树：qosmio/openwrt-ipq 的 25.12-nss 分支
#   - feeds 全部钉在 openwrt-25.12 发布分支，不跟 main
#   - 内核 6.12，与官方 openwrt-25.12 一致
#   - ipq807x 的 target.mk 里 kmod-qca-nss-drv / kmod-qca-nss-ecm 已是默认包
#
# 保守备选：REPO_BRANCH="24.10-nss"（作者标注 stable，内核回退到 6.6）

REPO_URL="https://github.com/qosmio/openwrt-ipq.git"
REPO_BRANCH="25.12-nss"

# 目标平台 / 子平台 / 设备
TARGET="qualcommax"
SUBTARGET="ipq807x"
DEVICE="redmi_ax6"

# 并行编译任务数，留空则用 nproc
BUILD_JOBS=""
